<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FAF5F2">
<title>MAMA — Interactive Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root {
    --ink: #1E2447;
    --muted: #767C9C;
    --faint: #A9AEC8;
    --bg: #FAF5F2;
    --surface: #FFFFFF;
    --surface-soft: #FBF8F6;
    --primary: #3A47AC;
    --primary-deep: #2E3A8C;
    --primary-soft: #E9EBF8;
    --grad: linear-gradient(150deg, #4757BE 0%, #33409E 55%, #2B3790 100%);
    --hero-grad: linear-gradient(150deg, #4051B5 0%, #33409E 60%, #2B3790 100%);
    --peach: #F0A17E;
    --peach-soft: #FCE9DB;
    --mint: #4CAF8B;
    --mint-soft: #E2F3EA;
    --rose: #D96D8B;
    --rose-soft: #FBE7EC;
    --gold-soft: #FFF6E0;
    --border: #F1E9E6;
    --shadow-sm: 0 2px 10px rgba(30,36,71,0.06);
    --shadow-md: 0 8px 24px rgba(30,36,71,0.10);
    --shadow-lg: 0 18px 40px rgba(46,58,140,0.30);
    /* legacy aliases kept for inline styles */
    --background: #FAF5F2;
    --on-surface: #1E2447;
    --on-surface-variant: #767C9C;
    --surface-variant: #F3EDEA;
    --outline: #DBD5DC;
    --primary-container: #E9EBF8;
    --on-primary-container: #2E3A8C;
    --secondary-container: #E9EBF8;
    --tertiary-container: #FCE9DB;
    --on-tertiary-container: #9A5B36;
    --error-container: #FBE7EC;
    --on-error-container: #A5405E;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1200px 800px at 15% -10%, #E4E7F8 0%, rgba(228,231,248,0) 55%),
                radial-gradient(1000px 700px at 110% 15%, #F8DFDA 0%, rgba(248,223,218,0) 50%),
                #F6EEEA;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 28px 12px; color: var(--ink);
  }
  .demo-note {
    max-width: 430px; text-align: center; margin-bottom: 18px;
    color: var(--muted); font-size: 13px; line-height: 1.6; font-weight: 500;
  }
  .demo-note b {
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
    font-weight: 800; letter-spacing: -0.01em;
  }
  .phone {
    width: 402px; max-width: 100%; height: 800px; max-height: 92vh;
    background: var(--bg); border-radius: 44px;
    box-shadow: 0 40px 90px rgba(30,36,71,0.30), 0 0 0 12px #161B3C, 0 0 0 13px #2B3474;
    overflow: hidden; display: flex; flex-direction: column; position: relative;
  }
  .screen { flex: 1; overflow-y: auto; padding: 26px 20px 16px; scrollbar-width: none; }
  .screen::-webkit-scrollbar { display: none; }

  h1.title { font-size: 28px; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 2px; }
  .subtitle { font-size: 13.5px; color: var(--muted); margin-bottom: 16px; font-weight: 500; }

  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  .card, .timeline, .hero-card, .welcome-card, .empty { animation: rise .38s cubic-bezier(.2,.7,.3,1) both; }

  /* ---- Floating bottom nav ---- */
  .navbar {
    display: flex; gap: 2px; margin: 0 14px 14px; padding: 8px;
    background: rgba(255,255,255,0.92); backdrop-filter: blur(14px);
    border-radius: 26px; box-shadow: var(--shadow-md); border: 1px solid var(--border);
  }
  .nav-item {
    flex: 1; text-align: center; cursor: pointer; font-size: 10.5px; font-weight: 600;
    color: var(--faint); position: relative; user-select: none; padding: 2px 0;
    transition: color .2s;
  }
  .nav-icon {
    display: inline-flex; align-items: center; justify-content: center;
    width: 46px; height: 32px; border-radius: 14px; margin-bottom: 2px;
    transition: background .25s, color .25s, transform .2s;
  }
  .nav-icon svg { width: 21px; height: 21px; }
  .nav-item.active { color: var(--primary-deep); }
  .nav-item.active .nav-icon { background: var(--primary-soft); color: var(--primary-deep); transform: translateY(-1px); }
  .nav-item:active .nav-icon { transform: scale(.9); }
  .nav-badge {
    position: absolute; top: -2px; right: 50%; margin-right: -22px;
    background: linear-gradient(135deg,#E98AA1,#D96D8B); color: #fff;
    border-radius: 10px; font-size: 9.5px; min-width: 17px; height: 17px;
    line-height: 17px; padding: 0 4px; font-weight: 800; box-shadow: 0 3px 8px rgba(217,109,139,.45);
    z-index: 2;
  }

  /* ---- Hero "next up" card ---- */
  .hero-card {
    position: relative; overflow: hidden; border-radius: 26px; padding: 20px;
    background: var(--hero-grad); color: #fff; margin-bottom: 18px;
    box-shadow: var(--shadow-lg);
  }
  .hero-card::after {
    content: ""; position: absolute; width: 190px; height: 190px; border-radius: 50%;
    background: rgba(255,255,255,0.12); top: -80px; right: -60px;
  }
  .hero-card::before {
    content: ""; position: absolute; width: 120px; height: 120px; border-radius: 50%;
    background: rgba(217,109,139,0.55); bottom: -55px; left: -35px;
  }
  .hero-label {
    font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
    opacity: .85; margin-bottom: 8px;
  }
  .hero-title { font-size: 21px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 4px; position: relative; z-index: 1; }
  .hero-sub { font-size: 13px; opacity: .92; font-weight: 500; position: relative; z-index: 1; }
  .hero-chip {
    display: inline-block; margin-top: 12px; padding: 7px 14px; border-radius: 999px;
    background: rgba(255,255,255,0.22); backdrop-filter: blur(6px);
    font-size: 12.5px; font-weight: 700; position: relative; z-index: 1;
  }

  /* ---- Cards ---- */
  .card {
    background: var(--surface); border-radius: 24px; padding: 16px;
    margin-bottom: 14px; box-shadow: var(--shadow-sm); border: 1px solid var(--border);
  }
  .event-card { display: flex; overflow: hidden; padding: 0; transition: transform .15s, box-shadow .2s; }
  .event-card:active { transform: scale(.985); }
  .accent-bar { width: 6px; flex-shrink: 0; border-radius: 0 6px 6px 0; }
  .event-body { padding: 15px 16px; flex: 1; }
  .event-row { display: flex; align-items: center; gap: 11px; }
  .avatar {
    width: 40px; height: 40px; border-radius: 14px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 16px;
  }
  .event-title { font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }
  .event-sub { font-size: 12.5px; color: var(--muted); font-weight: 500; margin-top: 1px; }
  .buffer-tag {
    display: inline-block; font-size: 11px; font-weight: 700; color: #9A5B36;
    background: var(--peach-soft); border-radius: 999px; padding: 4px 10px; margin-top: 9px;
  }
  .timeline { display: flex; gap: 11px; margin-bottom: 13px; }
  .time-col { width: 56px; text-align: right; flex-shrink: 0; padding-top: 14px; }
  .time-start { font-size: 12.5px; font-weight: 800; color: var(--ink); }
  .time-end { font-size: 11px; color: var(--faint); font-weight: 600; margin-top: 1px; }
  .card-actions { margin-top: 12px; display: flex; gap: 8px; }

  /* ---- Chips & buttons ---- */
  .chip {
    display: inline-block; padding: 8px 15px; border-radius: 999px;
    border: 1.5px solid var(--border); font-size: 13px; font-weight: 600; cursor: pointer;
    background: var(--surface); color: var(--muted); user-select: none; white-space: nowrap;
    transition: all .18s;
  }
  .chip:active { transform: scale(.95); }
  .chip.selected {
    background: var(--grad); border-color: transparent; color: #fff; font-weight: 700;
    box-shadow: 0 4px 12px rgba(46,58,140,.28);
  }
  .chip.small { padding: 6px 12px; font-size: 12px; }
  .btn {
    border: none; border-radius: 999px; padding: 12px 20px; font-size: 14px;
    font-weight: 700; cursor: pointer; font-family: inherit; letter-spacing: -0.01em;
    transition: transform .15s, box-shadow .2s, opacity .2s;
  }
  .btn:active { transform: scale(.97); }
  .btn-filled { background: var(--grad); color: #fff; box-shadow: 0 6px 18px rgba(46,58,140,.30); }
  .btn-outlined { background: var(--surface); color: var(--primary-deep); border: 1.5px solid var(--outline); }
  .btn-block { width: 100%; margin-top: 8px; }
  .btn:disabled { opacity: 0.45; cursor: default; box-shadow: none; }

  /* ---- Week picker ---- */
  .week-row { display: flex; gap: 7px; overflow-x: auto; margin-bottom: 16px; padding: 4px 2px 6px; scrollbar-width: none; }
  .week-row::-webkit-scrollbar { display: none; }
  .day-pill {
    min-width: 47px; text-align: center; border-radius: 18px; padding: 10px 4px 8px;
    background: var(--surface); border: 1px solid var(--border); cursor: pointer; user-select: none;
    transition: all .22s cubic-bezier(.2,.7,.3,1); box-shadow: var(--shadow-sm);
  }
  .day-pill:active { transform: scale(.93); }
  .day-pill.selected {
    background: var(--grad); border-color: transparent; transform: translateY(-3px);
    box-shadow: 0 8px 18px rgba(46,58,140,.32);
  }
  .day-pill .dow { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }
  .day-pill.selected .dow { color: rgba(255,255,255,.8); }
  .day-pill .dom { font-size: 17px; font-weight: 800; margin-top: 1px; color: var(--ink); }
  .day-pill.selected .dom { color: #fff; }
  .day-pill .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--peach); margin: 4px auto 0; }
  .day-pill.selected .dot { background: #fff; }
  .day-pill .dot.hidden { visibility: hidden; }

  /* ---- Inputs ---- */
  .input-row {
    display: flex; align-items: center; gap: 8px;
    border: 1.5px solid var(--border); border-radius: 999px;
    padding: 7px 8px 7px 16px; margin-bottom: 16px; background: var(--surface);
    box-shadow: var(--shadow-sm); transition: border-color .2s, box-shadow .2s;
  }
  .input-row:focus-within { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(58,71,172,.12); }
  .input-row input {
    flex: 1; border: none; outline: none; font-size: 14px; font-family: inherit;
    background: transparent; color: var(--ink); font-weight: 500;
  }
  .input-row input::placeholder { color: var(--faint); }
  .send-btn {
    width: 38px; height: 38px; border-radius: 50%; border: none; cursor: pointer;
    background: var(--grad); color: #fff; font-size: 15px; flex-shrink: 0;
    box-shadow: 0 4px 12px rgba(46,58,140,.35); transition: transform .15s;
  }
  .send-btn:active { transform: scale(.9); }
  .sparkle { color: var(--primary); font-size: 16px; }

  /* ---- Segmented ---- */
  .segmented {
    display: flex; background: #EFE7E3; border-radius: 999px; overflow: hidden;
    margin-bottom: 16px; padding: 4px; gap: 2px;
  }
  .segment {
    flex: 1; text-align: center; padding: 9px 0; font-size: 13px; font-weight: 600;
    cursor: pointer; user-select: none; border-radius: 999px; color: var(--muted);
    transition: all .2s;
  }
  .segment.selected { background: var(--surface); font-weight: 800; color: var(--ink); box-shadow: var(--shadow-sm); }
  .segment + .segment { border-left: none; }

  /* ---- Month grid ---- */
  .month-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .month-head .mh-title { font-weight: 800; font-size: 17px; letter-spacing: -0.02em; }
  .icon-btn {
    background: var(--surface); border: 1px solid var(--border); font-size: 17px; cursor: pointer;
    color: var(--ink); width: 36px; height: 36px; border-radius: 12px;
    box-shadow: var(--shadow-sm); transition: transform .15s; font-family: inherit;
  }
  .icon-btn:active { transform: scale(.9); }
  .dow-row, .month-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .dow-cell { text-align: center; font-size: 10.5px; font-weight: 700; letter-spacing: .08em; color: var(--faint); padding: 6px 0; }
  .day-cell {
    aspect-ratio: 1; border-radius: 14px; text-align: center; padding-top: 7px;
    font-size: 13px; font-weight: 600; cursor: pointer; user-select: none; color: var(--ink);
    transition: background .18s, transform .15s;
  }
  .day-cell:active { transform: scale(.9); }
  .day-cell.today { background: var(--rose-soft); color: var(--rose); font-weight: 800; }
  .day-cell.selected { background: var(--grad); color: #fff; font-weight: 800; box-shadow: 0 6px 14px rgba(46,58,140,.3); }
  .dots { display: flex; gap: 2.5px; justify-content: center; margin-top: 3px; }
  .dots span { width: 5px; height: 5px; border-radius: 50%; }
  .legend { display: flex; gap: 14px; margin-top: 14px; font-size: 12px; font-weight: 600; color: var(--muted); flex-wrap: wrap; }
  .legend span.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }

  /* ---- Approvals ---- */
  .conflict-box {
    background: var(--rose-soft); color: var(--rose);
    border-radius: 14px; padding: 10px 12px; font-size: 12px; font-weight: 600;
    margin-top: 10px; line-height: 1.5;
  }
  .raw-input { font-style: italic; font-size: 12px; color: var(--faint); margin-top: 8px; font-weight: 500; }
  .approve-row { display: flex; gap: 8px; margin-top: 14px; }
  .approve-row .btn { flex: 1; padding: 11px 8px; }

  /* ---- Chat ---- */
  .chat-area { display: flex; flex-direction: column; gap: 9px; padding-bottom: 8px; }
  .bubble {
    max-width: 80%; padding: 11px 15px; border-radius: 20px; font-size: 14px;
    line-height: 1.5; white-space: pre-wrap; font-weight: 500;
    animation: rise .3s cubic-bezier(.2,.7,.3,1) both; box-shadow: var(--shadow-sm);
  }
  .bubble.user {
    align-self: flex-end; background: var(--grad); color: #fff;
    border-bottom-right-radius: 6px; box-shadow: 0 6px 16px rgba(46,58,140,.25);
  }
  .bubble.ai { align-self: flex-start; background: var(--surface); color: var(--ink); border: 1px solid var(--border); border-bottom-left-radius: 6px; }
  .bubble .stamp { display: block; font-size: 9.5px; opacity: 0.6; margin-top: 5px; text-align: right; font-weight: 600; }
  .welcome-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 26px;
    padding: 22px; margin-bottom: 4px; box-shadow: var(--shadow-md); position: relative; overflow: hidden;
  }
  .welcome-card::after {
    content: ""; position: absolute; width: 140px; height: 140px; border-radius: 50%;
    background: radial-gradient(circle, rgba(217,109,139,.18), transparent 70%); top: -50px; right: -40px;
  }
  .welcome-card h3 { font-size: 16px; font-weight: 800; letter-spacing: -0.02em; margin: 8px 0 5px; }
  .welcome-card p { font-size: 13px; color: var(--muted); font-weight: 500; line-height: 1.55; }
  .suggest-row { display: flex; gap: 8px; overflow-x: auto; padding: 8px 0; scrollbar-width: none; }
  .suggest-row::-webkit-scrollbar { display: none; }
  .typing {
    align-self: flex-start; background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; border-bottom-left-radius: 6px; padding: 13px 16px; box-shadow: var(--shadow-sm);
  }
  .typing span {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--primary); margin: 0 2px; animation: blink 1s infinite;
  }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,100% { opacity: .2; transform: translateY(0) } 50% { opacity: 1; transform: translateY(-2px) } }
  .action-card {
    background: linear-gradient(135deg,#FCE9DB,#FBDFC9); color: #9A5B36;
    border-radius: 20px; padding: 16px; border: 1px solid #F6DCC5; box-shadow: var(--shadow-sm);
  }
  .action-card b { display: block; margin-bottom: 4px; font-size: 14px; font-weight: 800; }
  .action-card p { font-size: 13px; margin-bottom: 12px; font-weight: 500; }

  /* ---- Family ---- */
  .kid-row { display: flex; align-items: center; gap: 12px; padding: 9px 0; }
  .kid-row .info { flex: 1; }
  .kid-row .name { font-weight: 700; font-size: 14.5px; letter-spacing: -0.01em; }
  .kid-row .lim { font-size: 12px; color: var(--muted); font-weight: 500; margin-top: 1px; }
  .del-btn { background: none; border: none; color: #D9D2E9; cursor: pointer; font-size: 16px; transition: color .2s; }
  .del-btn:active { color: var(--rose); }
  .setting-row { display: flex; align-items: center; gap: 12px; }
  .setting-row .info { flex: 1; }
  .setting-row .name { font-weight: 700; font-size: 14.5px; letter-spacing: -0.01em; }
  .setting-row .sub { font-size: 12px; color: var(--muted); font-weight: 500; margin-top: 1px; }
  .switch { position: relative; width: 48px; height: 28px; flex-shrink: 0; cursor: pointer; }
  .switch input { display: none; }
  .slider-t { position: absolute; inset: 0; background: #E7E0E4; border-radius: 28px; transition: .25s; }
  .slider-t:before {
    content: ""; position: absolute; width: 22px; height: 22px; border-radius: 50%;
    background: #fff; top: 3px; left: 3px; transition: .25s cubic-bezier(.2,.7,.3,1.2);
    box-shadow: 0 2px 6px rgba(30,36,71,.2);
  }
  .switch input:checked + .slider-t { background: var(--grad); }
  .switch input:checked + .slider-t:before { transform: translateX(20px); }
  .section-title { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 15px; letter-spacing: -0.01em; margin-bottom: 10px; }

  /* ---- FAB ---- */
  .fab {
    position: absolute; right: 22px; bottom: 108px; width: 58px; height: 58px;
    border-radius: 20px; border: none; background: var(--grad);
    color: #fff; font-size: 26px; cursor: pointer;
    box-shadow: 0 12px 28px rgba(46,58,140,.40); z-index: 5;
    transition: transform .18s cubic-bezier(.2,.7,.3,1.4);
  }
  .fab:active { transform: scale(.88) rotate(90deg); }

  /* ---- Dialog ---- */
  .overlay {
    position: absolute; inset: 0; background: rgba(22,27,60,0.45); backdrop-filter: blur(4px);
    z-index: 30; display: flex; align-items: center; justify-content: center; padding: 20px;
    animation: fadein .2s ease both;
  }
  @keyframes fadein { from { opacity: 0 } to { opacity: 1 } }
  .dialog {
    background: var(--surface); border-radius: 30px; padding: 24px;
    width: 100%; max-height: 88%; overflow-y: auto; box-shadow: 0 24px 60px rgba(30,36,71,.35);
    animation: rise .3s cubic-bezier(.2,.7,.3,1) both;
  }
  .dialog h2 { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 14px; }
  .dialog label { display: block; font-size: 11.5px; font-weight: 700; letter-spacing: .04em; margin: 14px 0 6px; color: var(--muted); text-transform: uppercase; }
  .dialog input[type=text] {
    width: 100%; padding: 13px 14px; border: 1.5px solid var(--border); border-radius: 14px;
    font-size: 14px; font-family: inherit; font-weight: 500; background: var(--surface-soft); color: var(--ink);
    outline: none; transition: border-color .2s, box-shadow .2s;
  }
  .dialog input[type=text]:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(58,71,172,.12); }
  .chip-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  .swatches { display: flex; gap: 10px; flex-wrap: wrap; }
  .swatch { width: 36px; height: 36px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: transform .15s; }
  .swatch:active { transform: scale(.85); }
  .swatch.selected { border-color: var(--ink); transform: scale(1.08); }
  input[type=range] { width: 100%; accent-color: var(--primary); }

  /* ---- Snackbar ---- */
  .snackbar {
    position: absolute; left: 18px; right: 18px; bottom: 104px; background: #1E2447; color: #F6F4FB;
    padding: 13px 17px; border-radius: 16px; font-size: 13px; font-weight: 600; line-height: 1.45;
    z-index: 20; opacity: 0; transform: translateY(12px) scale(.97); transition: .28s cubic-bezier(.2,.7,.3,1);
    pointer-events: none; box-shadow: 0 14px 34px rgba(30,36,71,.4);
  }
  .snackbar.show { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
  .snackbar { display: flex; align-items: center; gap: 10px; pointer-events: none; }
  .snack-btn {
    background: none; border: none; color: #A9B4FF; font-weight: 800; font-size: 13px;
    cursor: pointer; font-family: inherit; padding: 4px 6px; flex-shrink: 0;
  }
  .loc-line { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 600; margin-top: 7px; }
  .remind-tag {
    display: inline-block; font-size: 11px; font-weight: 700; color: var(--primary-deep);
    background: var(--primary-soft); border-radius: 999px; padding: 4px 10px; margin-top: 9px; margin-left: 6px;
  }

let gAccessToken = null, gTokenExpiry = 0, gTokenClient = null;

function googleSignIn() {
  const ai = aiCfg();
  readAIFields();
  if (!ai.gClientId) { toast("Paste your OAuth Client ID first (from Google Cloud Console)"); return; }
  if (location.protocol === "file:") {
    toast("Google login needs the demo hosted at a URL (e.g. Netlify Drop) — it can't run from a local file");
    return;
  }
  if (!window.google || !google.accounts || !google.accounts.oauth2) {
    toast("Google sign-in library not loaded yet — check your connection and retry");
    return;
  }
  try {
    gTokenClient = google.accounts.oauth2.initTokenClient({
      client_id: ai.gClientId,
      scope: "https://www.googleapis.com/auth/cloud-platform https://www.googleapis.com/auth/generative-language.retriever",
      callback: (resp) => {
        if (resp.error) { toast(`❌ Google login failed: ${resp.error}`); return; }
        gAccessToken = resp.access_token;
        gTokenExpiry = Date.now() + ((resp.expires_in || 3600) - 60) * 1000;
        toast("✅ Signed in with Google — Gemini is live");
        render();
      },
      error_callback: (err) => toast(`❌ Google login: ${err.type || err.message || "popup blocked or closed"}`)
    });

  } catch (e) {
    toast(`❌ Google login setup failed: ${String(e.message || e).slice(0,120)}`);
  }
}
function googleSignOut() {
  if (gAccessToken && window.google && google.accounts && google.accounts.oauth2) {
    try { google.accounts.oauth2.revoke(gAccessToken, () => {}); } catch (e) {}
  }
  gAccessToken = null; gTokenExpiry = 0;
  toast("Signed out of Google"); render();
}

  if (ai.provider === "gemini" && ai.gAuth === "google") return googleSignedIn();

function extractJson(text) {
  let t = String(text).replace(/<think>[\s\S]*?<\/think>/gi, "").trim()
    .replace(/^```json/i, "").replace(/^```/, "").replace(/```$/, "").trim();
  const start = t.indexOf("{");
  if (start > 0) t = t.slice(start);
  const end = t.lastIndexOf("}");
  if (end >= 0) t = t.slice(0, end + 1);
  return JSON.parse(t);
}

async function callLLM(systemPrompt, userPrompt) {
  const ai = aiCfg();
  const key = ai.key.trim();
  const model = (ai.model || (AI_PROVIDERS[ai.provider].model || "")).trim();

  // MAMA Cloud: Google login token -> family gateway (server holds the Gemini key)
  if (ai.provider === "mama") {
    const gw = mamaGatewayUrl();
    if (!gw) throw new Error(t("mamaNotSetup"));
    if (!mamaSignedIn()) throw new Error(t("signInFirst"));
    const resp = await fetch(`${gw}/gemini?model=${encodeURIComponent(model || "gemini-3.5-flash")}`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": `Bearer ${mamaIdToken}` },
      body: JSON.stringify({
        system_instruction: { parts: [{ text: systemPrompt }] },
        contents: [{ role: "user", parts: [{ text: userPrompt }] }],
        generationConfig: { responseMimeType: "application/json" }
      })
    });
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok) throw new Error(data.error ? String(data.error).slice(0, 180) : `Gateway HTTP ${resp.status}`);
    const text = data.candidates && data.candidates[0] && data.candidates[0].content
      && data.candidates[0].content.parts && data.candidates[0].content.parts[0]
      && data.candidates[0].content.parts[0].text;
    if (!text) throw new Error("Empty gateway response");
    return text;
  }

  const geminiOAuth = ai.provider === "gemini" && ai.gAuth === "google";
  if (!key && !geminiOAuth) throw new Error("No API key set");

  if (ai.provider === "gemini") {
    let url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`;
    const headers = { "Content-Type": "application/json" };
    if (geminiOAuth) {
      if (!googleSignedIn()) throw new Error("Google session expired — sign in again in the Family tab");
      headers["Authorization"] = `Bearer ${gAccessToken}`;
      if (ai.gProject) headers["x-goog-user-project"] = ai.gProject.trim();
    } else {
      url += `?key=${encodeURIComponent(key)}`;
    }
    const resp = await fetch(url,
      {
        method: "POST",
        headers,
        body: JSON.stringify({
          system_instruction: { parts: [{ text: systemPrompt }] },
          contents: [{ role: "user", parts: [{ text: userPrompt }] }],
          generationConfig: { responseMimeType: "application/json" }
        })
      });
    if (!resp.ok) throw new Error(`Gemini HTTP ${resp.status}: ${(await resp.text()).slice(0,180)}`);
    const data = await resp.json();
    const text = data.candidates && data.candidates[0] && data.candidates[0].content
      && data.candidates[0].content.parts && data.candidates[0].content.parts[0]
      && data.candidates[0].content.parts[0].text;
    if (!text) throw new Error("Empty Gemini response");
    return text;
  }

  // OpenAI-compatible (DeepSeek / OpenAI / MiniMax / custom)
  const url = (ai.url || AI_PROVIDERS[ai.provider].url || "").trim();
  if (!url) throw new Error("No endpoint URL set");
  const body = {
    model,
    messages: [
      { role: "system", content: systemPrompt },
      { role: "user", content: userPrompt }
    ],
    response_format: { type: "json_object" },
    temperature: 0.3
  };
  if (ai.provider === "minimax") {
    body.thinking = { type: "disabled" }; // skip reasoning output for clean JSON
    body.temperature = 1.0; // MiniMax recommended range
  }
  const resp = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${key}` },
    body: JSON.stringify(body)
  });
  if (!resp.ok) throw new Error(`HTTP ${resp.status}: ${(await resp.text()).slice(0,180)}`);
  const data = await resp.json();
  // MiniMax reports errors inside base_resp even with HTTP 200
  if (data.base_resp && data.base_resp.status_code !== 0 && data.base_resp.status_msg) {
    throw new Error(`${data.base_resp.status_code}: ${data.base_resp.status_msg}`);
  }
  if (data.error && data.error.message) throw new Error(data.error.message.slice(0,180));
  const text = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
  if (!text) throw new Error("Empty response");
  return text;
}

function friendlyAIError(err) {
  const m = String(err.message || err);
  if (/failed to fetch|networkerror|load failed/i.test(m)) {
    if (aiCfg().provider === "minimax") {
      return "MiniMax blocks direct browser calls (CORS). Fix: deploy the included cors_proxy_worker.js on Cloudflare Workers (free, ~2 min), then set the Endpoint URL to https://<your-worker>.workers.dev/minimax";
    }
    return "Network/CORS blocked — the provider may not allow browser calls from a local file. Try hosting the demo on a URL (e.g. Netlify Drop), or check your connection.";
  }
  if (/1004|401|invalid api key|authentication/i.test(m) && aiCfg().provider === "minimax") {
    return m + " — if your key is from the China platform (minimaxi.com), change the endpoint URL to https://api.minimaxi.com/v1/chat/completions";
  }
  return m;
}

// One automatic retry — Ocean/Agnes hit intermittent provider failures
async function callLLMRetry(systemPrompt, userPrompt) {
  try {
    return await callLLM(systemPrompt, userPrompt);
  } catch (e) {
    return await callLLM(systemPrompt, userPrompt);
  }
}

async function llmChat(userMessage) {
  const history = state.chat.slice(-8).map(m => `${m.from === "user" ? "User" : "Assistant"}: ${m.text}`).join("\n");
  const raw = await callLLMRetry(chatSystemPrompt(), `CONVERSATION HISTORY:\n${history}\n\nUSER: ${userMessage}`);
  const json = extractJson(raw);
  const reply = { text: json.response || "I understand!" };
  const a = json.action;
  if (a && a.type) {
    const toMins = s => { const m = String(s || "").match(/(\d{1,2}):(\d{2})/); return m ? (+m[1])*60 + (+m[2]) : null; };
    if (a.type === "move" && a.eventId != null) {
      const ev = state.events.find(e => e.id === a.eventId);
      const ns = toMins(a.start);
      if (ev && ns != null) reply.action = { eventId: ev.id, newStart: ns, newDate: a.date || null,
        desc: `Move ${ev.title} to ${fmtTime(ns)}${a.date && a.date !== ev.date ? " on " + displayDate(a.date) : ""}` };
    } else if (a.type === "cancel" && a.eventId != null) {
      const ev = state.events.find(e => e.id === a.eventId);
      if (ev) reply.action = { eventId: ev.id, cancel: true, desc: `Cancel ${ev.title} (${displayDate(ev.date)})` };
    } else if (a.type === "note" && a.eventId != null && a.note) {
      const ev = state.events.find(e => e.id === a.eventId);
      if (ev) reply.action = { eventId: ev.id, note: a.note, desc: `Add note to ${ev.title}: ${a.note}` };
    } else if (a.type === "add" && a.title) {
      const ns = toMins(a.start) ?? 15*60;
      const kid = state.kids.find(k => a.kidName && k.name.toLowerCase() === String(a.kidName).toLowerCase());
      reply.action = { add: { title: a.title, kidId: kid ? kid.id : null, date: a.date || todayStr(),
        start: ns, end: ns + (a.durationMinutes || 60), buffer: 0, recurring: false, raw: userMessage },
        desc: `Add ${a.title} for ${kid ? kid.name : "the family"} on ${displayDate(a.date || todayStr())} at ${fmtTime(ns)}` };
    }
  }
  return reply;
}

async function llmParseNL(text) {
  const system = `You parse family scheduling requests into structured JSON for the MAMA app.

${scheduleContext()}

The input may be very short (e.g. just "Soccer" or "游水") — fill sensible defaults: today's date, 3pm start, 60 minutes. The input may be in English or Chinese — KEEP the title in the same language the user typed (do not translate).
Relative times like "in 30 mins" mean now + 30 minutes, today.
Multiple family members can join one event — list them all in "kidNames".
The title must describe the activity, never a generic word like "Activity".

Return ONLY a JSON object, no markdown fences:
{"events":[{"title":"...","kidNames":["<name>", "..."],"date":"YYYY-MM-DD","start":"HH:MM","durationMinutes":60,"travelBufferMinutes":0,"recurring":false,"location":"<place or null>"}]}`;
  const raw = await callLLMRetry(system, text);
  const json = extractJson(raw);
  const out = [];
  for (const e of (json.events || [])) {
    const m = String(e.start || "15:00").match(/(\d{1,2}):(\d{2})/);
    const start = m ? (+m[1])*60 + (+m[2]) : 15*60;
    const names = e.kidNames || (e.kidName ? [e.kidName] : []);
    const pids = names
      .map(n => state.kids.find(k => k.name.toLowerCase() === String(n).toLowerCase()))
      .filter(Boolean).map(k => k.id);
    out.push({ title: e.title || "Activity", kidId: pids[0] != null ? pids[0] : null,
      participants: pids, date: e.date || todayStr(),
      start, end: start + (e.durationMinutes || 60), buffer: e.travelBufferMinutes || 0,
      recurring: !!e.recurring, location: e.location || null, raw: text });
  }
  return out;
}

    ["basketball","🏀"],["art","🎨"],["draw","🎨"],["read","📖"],["hik","🥾"],["cycl","🚴"],["bike","🚴"],
    ["violin","🎻"],["tutor","📚"],["church","⛪"],["playdate","🧸"],["birthday","🎂"],["party","🎉"],
    ["游水","🏊"],["足球","⚽"],["鋼琴","🎹"],["畫畫","🎨"],["補習","📚"]
  ];
  for (const [k, e] of map) if (t.includes(k)) return e;
  return "⭐";
}
const kidById = id => state.kids.find(k => k.id === id) || null;
const kidColor = id => (kidById(id) || {}).color || "#6750A4";
const kidName = id => (kidById(id) || {}).name || null;
// Participants: events may have participants[] (multi); fall back to kidId
const eventKids = e => (e.participants && e.participants.length) ? e.participants : (e.kidId != null ? [e.kidId] : []);
const eventNames = e => {
  const names = eventKids(e).map(id => kidName(id)).filter(Boolean);
  return names.length ? names.join(" + ") : t("famOpt");
};
// Deterministic simulated travel minutes between two events
// Travel estimates are location-based (drive time); no mode setting needed —
// tapping a 📍 location opens maps / ride-hailing instead.
function travelMins(a, b) {
  if (!a.location && !b.location) return null;
  return ((a.id * 7 + b.id * 13) % 23) + 8;
}
function travelKm(a, b) {
  const seed = ((a.id * 7 + b.id * 13) % 23) + 8;
  return (seed * 0.22).toFixed(1);
}
// Deterministic simulated weather per date
function weatherFor(dateStr) {
  let h = 0;
  for (const ch of dateStr) h = (h * 31 + ch.charCodeAt(0)) % 997;
  const opts = [
    { icon: "☀️", temp: 27, rain: false }, { icon: "⛅", temp: 24, rain: false },
    { icon: "🌧", temp: 22, rain: true },  { icon: "☀️", temp: 29, rain: false },
    { icon: "🌤", temp: 25, rain: false }
  ];
  return opts[h % opts.length];
}

// ---------- Conflict detection ----------
function checkConflicts(ev, excludeId) {
  const out = [];
  for (const e of state.events) {
    if (e.id === excludeId || e.date !== ev.date) continue;
    if (ev.start < e.end && e.start < ev.end) {
      out.push(`Clashes with ${kidName(e.kidId) ? kidName(e.kidId)+"'s" : "the family's"} "${e.title}" (${fmtTime(e.start)} – ${fmtTime(e.end)}).`);
      continue;
    }
    if (ev.start < e.end + (e.buffer||0) && e.start < ev.end + (ev.buffer||0)) {
      out.push(`Travel time overlaps with "${e.title}" (${ev.buffer||0}m / ${e.buffer||0}m buffers).`);
    }
  }
  if (ev.kidId) {
    const k = kidById(ev.kidId);
    const count = state.events.filter(e => e.kidId === ev.kidId && e.date === ev.date && e.id !== excludeId).length;
    if (k && count >= k.limit) out.push(`${k.name} already has ${count} of ${k.limit} daily activities booked.`);
  }
  return out;
}

// ---------- Mock NL parser ----------
const ACTIVITY_MAP = { swim: "Swimming", swimming: "Swimming", soccer: "Soccer", football: "Football",
  piano: "Piano Lesson", music: "Music Practice", dentist: "Dentist Appointment", doctor: "Doctor Appointment",
  tennis: "Tennis Lesson", karate: "Karate Lesson", dance: "Dance Class", ballet: "Ballet Class",
  chinese: "Chinese Lesson", math: "Math Tutoring", school: "School Event", dinner: "Dinner", lunch: "Lunch" };

function parseNL(text) {
  const lower = text.toLowerCase();
  // All mentioned family members become participants (Agnes: multi-select)
  const mentioned = state.kids.filter(k => lower.includes(k.name.toLowerCase()));
  let kid = mentioned[0] || null;

  let title = "Activity";
  for (const [k,v] of Object.entries(ACTIVITY_MAP)) { if (lower.includes(k)) { title = v; break; } }

  let date = todayStr();
  if (/(tomorrow|tmrw|tmr|聽日)/.test(lower)) date = addDays(todayStr(), 1);
  else {
    const days = ["sunday","monday","tuesday","wednesday","thursday","friday","saturday"];
    for (let i = 0; i < 7; i++) {
      if (lower.includes(days[i]) || new RegExp(`\\b${days[i].slice(0,3)}\\b`).test(lower)) {
        const cur = new Date().getDay();
        let off = (i - cur + 7) % 7; if (off === 0) off = 7;
        date = addDays(todayStr(), off); break;
      }
    }
  }

  let start = 15*60, dur = 60;
  // Relative time: "call with miles in 30 mins" / "in 2 hours"
  const rel = lower.match(/\bin\s+(\d+)\s*(min|mins|minutes|hr|hrs|hour|hours)\b/);
  if (rel) {
    const n = +rel[1];
    const mins = /h/.test(rel[2]) ? n * 60 : n;
    const now = new Date();
    start = now.getHours() * 60 + now.getMinutes() + mins;
    if (start >= 1440) { start -= 1440; date = addDays(todayStr(), 1); }
    // Title = text minus the "in X mins" phrase and member names
    let cleaned = text.replace(/\bin\s+\d+\s*(min|mins|minutes|hr|hrs|hour|hours)\b/i, "");
    for (const k of mentioned) cleaned = cleaned.replace(new RegExp(k.name, "ig"), "");
    cleaned = cleaned.replace(/\s+/g, " ").trim();
    if (cleaned) title = cleaned[0].toUpperCase() + cleaned.slice(1);
    return { title, kidId: kid ? kid.id : null,
      participants: mentioned.map(k => k.id), date, start, end: start + 30,
      buffer: 0, recurring: false, location: null, raw: text };
  }
  const range = lower.match(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\s*(?:-|–|—|~|至|to)\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/);
  const single = lower.match(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)/);
  const to24 = (h, ap) => ap === "pm" && h < 12 ? h+12 : (ap === "am" && h === 12 ? 0 : h);
  if (range) {
    const ap1 = range[3] || range[6] || "pm";
    const sh = to24(+range[1], ap1), eh = to24(+range[4], range[6] || ap1);
    start = sh*60 + (+(range[2]||0));
    const end = eh*60 + (+(range[5]||0));
    dur = end > start ? end - start : 60;
  } else if (single) {
    start = to24(+single[1], single[3])*60 + (+(single[2]||0));
  } else if (lower.includes("lunch") || lower.includes("noon")) start = 12*60;
  else if (lower.includes("breakfast")) start = 8*60;
  else if (lower.includes("dinner")) start = 18*60;

  let buffer = 0;
  if (/travel|buffer/.test(lower)) {
    const b = lower.match(/(\d+)\s*(m|min)/); buffer = b ? +b[1] : 15;
  }
  const recurring = /every|weekly|recurring/.test(lower);

  // Location: "at <place>" where place starts with a letter (avoids "at 3pm")
  let location = null;
  const locMatch = text.match(/(?:^|\s)at\s+([A-Za-z][A-Za-z' ]{2,30}?)(?=\s+(?:tomorrow|today|tmrw|tmr|on|from|at\s|\d|mon(?:day)?|tue(?:sday)?|wed(?:nesday)?|thu(?:rsday)?|fri(?:day)?|sat(?:urday)?|sun(?:day)?|every|next)\b|\s*$)/i);
  if (locMatch) location = locMatch[1].trim();

  // No keyword matched: build a title from the remaining words instead of "Activity"
  if (title === "Activity") {
    let cleaned = text
      .replace(/\d{1,2}(:\d{2})?\s*(am|pm)?\s*(-|–|—|~|至|to)\s*\d{1,2}(:\d{2})?\s*(am|pm)?/ig, "")
      .replace(/\d{1,2}(:\d{2})?\s*(am|pm)/ig, "")
      .replace(/\b(tomorrow|today|tmrw|tmr|this|next|every|weekly|on|add|new|at|with|for|min|mins|buffer|travel)\b/ig, "")
      .replace(/\b(mon|tue|wed|thu|fri|sat|sun)(day|sday|nesday|rsday|urday)?\b/ig, "")
      .replace(/\d+\s*m\b/ig, "").replace(/\d+/g, "");
    for (const k of mentioned) cleaned = cleaned.replace(new RegExp(k.name, "ig"), "");
    if (location) cleaned = cleaned.replace(new RegExp(location, "ig"), "");
    cleaned = cleaned.replace(/[^\w一-鿿' ]/g, " ").replace(/\s+/g, " ").trim();
    if (cleaned) title = cleaned[0].toUpperCase() + cleaned.slice(1);
  }

  return { title, kidId: kid ? kid.id : null, participants: mentioned.map(k => k.id),
    date, start, end: start + dur, buffer, recurring, location, raw: text };
}

// ---------- Memories: photo highlights per activity ----------
function downscalePhoto(file, maxSide, cb) {
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      cb(canvas.toDataURL("image/jpeg", 0.72));
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

function addEventPhotos(eventId) {
  const ev = state.events.find(e => e.id === eventId);
  if (!ev) return;
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "image/*";
  input.multiple = true;
  input.onchange = () => {
    const files = [...(input.files || [])].slice(0, 6);
    let done = 0;
    files.forEach(f => downscalePhoto(f, 560, (dataUrl) => {
      state.memories.push({
        id: state.nextMemoryId++, eventId: ev.id, dataUrl,
        title: ev.title, who: eventNames(ev), date: ev.date, addedAt: Date.now()
      });
      // Keep localStorage healthy: cap at 18 photos, oldest out first
      while (state.memories.length > 18) state.memories.shift();
      if (++done === files.length) {
        save();
        toast(`📸 ${done} ${t("memAdded")}`);
        render();
      }
    }));
  };
  input.click();
}

      if (reply.action) state.pendingAction = reply.action;

function mockAgent(text) {
  const lower = text.toLowerCase();

  const zh = lang() === "zh";

  // ---- Slash commands (Agnes's /help reference) ----
  if (lower.startsWith("/")) {
    if (lower.startsWith("/help")) {
      return { text: zh
        ? "指令：\n/summary — 今日日程摘要\n/query <字> — 搜尋活動（例：/query swim）\n/querythisweek — 今個星期所有活動\n/help — 呢個列表\n直接打字都得：加活動、改時間、取消、加備註。"
        : "Commands:\n/summary — today's schedule summary\n/query <term> — search events (e.g. /query swim)\n/querythisweek — everything this week\n/help — this list\nOr just type naturally: add, move, cancel, add notes." };
    }
    if (lower.startsWith("/summary")) {
      const evs = state.events.filter(e => e.date === todayStr()).sort((a,b) => a.start-b.start);
      if (!evs.length) return { text: zh ? "今日冇活動。" : "Nothing scheduled today." };
      return { text: (zh ? "今日摘要：\n" : "Today's summary:\n") + evs.map(e =>
        `• ${fmtTime(e.start)} ${eventNames(e)}: ${e.title}${e.location ? " 📍" + e.location : ""}${e.notes ? " 📝" + e.notes : ""}`).join("\n") };
    }
    if (lower.startsWith("/querythisweek")) {
      const wk = new Set(weekDates(todayStr()));
      const evs = state.events.filter(e => wk.has(e.date)).sort((a,b) => a.date === b.date ? a.start-b.start : (a.date < b.date ? -1 : 1));
      if (!evs.length) return { text: zh ? "今個星期冇活動。" : "Nothing this week." };
      return { text: (zh ? "今個星期：\n" : "This week:\n") + evs.map(e => `• ${displayDateL(e.date)} ${fmtTime(e.start)} — ${eventNames(e)}: ${e.title}`).join("\n") };
    }
    if (lower.startsWith("/query")) {
      const term = text.slice(6).trim().toLowerCase();
      if (!term) return { text: zh ? "用法：/query <關鍵字或日期>" : "Usage: /query <keyword or date>" };
      const evs = state.events.filter(e =>
        e.title.toLowerCase().includes(term) || e.date.includes(term) ||
        (e.location || "").toLowerCase().includes(term) ||
        (kidName(e.kidId) || "").toLowerCase().includes(term));
      if (!evs.length) return { text: zh ? `搵唔到「${term}」相關嘅活動。` : `No events matching "${term}".` };
      return { text: (zh ? "搵到：\n" : "Found:\n") + evs.map(e => `• ${displayDateL(e.date)} ${fmtTime(e.start)} — ${eventNames(e)}: ${e.title}`).join("\n") };
    }
    return { text: zh ? "唔識呢個指令 — 打 /help 睇下有咩用得。" : "Unknown command — type /help to see what's available." };
  }

  // ---- Add a note to an event (Agnes: "add note to today's piano lesson - bring folder") ----
  const noteMatch = text.match(/(?:add\s+)?note(?:\s+to)?\s+(?:today'?s\s+|tomorrow'?s\s+)?(.+?)\s*[-–—:]\s*(.+)/i)
    || text.match(/(?:同|幫)?(.+?)(?:加|寫)(?:個)?(?:備註|note)[：:\-\s]+(.+)/);
  if (noteMatch) {
    const [, targetStr, note] = noteMatch;
    const target = state.events.find(e =>
      targetStr.toLowerCase().includes(e.title.toLowerCase()) ||
      e.title.toLowerCase().includes(targetStr.trim().toLowerCase()));
    if (target) return {
      text: zh
        ? `好呀 — 幫「${target.title}」（${displayDateL(target.date)}）加備註：「${note.trim()}」。確認？`
        : `Sure — add this note to ${target.title} (${displayDateL(target.date)}): "${note.trim()}". Confirm below.`,
      action: { eventId: target.id, note: note.trim(), desc: zh
        ? `備註 → ${target.title}：${note.trim()}`
        : `Add note to ${target.title}: ${note.trim()}` }
    };
    return { text: zh ? `搵唔到叫「${targetStr.trim()}」嘅活動。` : `I couldn't find an event called "${targetStr.trim()}".` };
  }

  // Weather (Celsius per feedback)
  if (/(weather|rain|storm|outdoor|天氣|落雨)/.test(lower)) {
    const outdoor = state.events.find(e => /swim|soccer|tennis|park|camp|游水|足球/i.test(e.title));
    if (outdoor) return { text: zh
      ? `${outdoor.title}嗰日天氣唔錯！天晴 24°C，微風。冇天氣問題！☀️`
      : `The forecast for ${outdoor.title} looks good! Clear sky, 24°C with a light breeze. No weather concerns! ☀️` };
    return { text: zh
      ? "未來幾日冇戶外活動，天氣都幾穩定。☀️"
      : "Nothing outdoors coming up in the next few days, and the forecast looks calm. ☀️" };
  }

  // Today / schedule questions
  if ((/(today|on today|schedule)/.test(lower) || /今日|安排/.test(text)) && !/move|change|cancel|改|取消/.test(lower)) {
    const evs = state.events.filter(e => e.date === todayStr()).sort((a,b) => a.start-b.start);
    if (!evs.length) return { text: zh ? "今日好空閒 — 冇活動安排。好好休息！🌿" : "Today is wide open — no activities scheduled. Enjoy the calm! 🌿" };
    return { text: (zh ? "今日安排：\n" : "Here's today:\n") + evs.map(e => `• ${kidName(e.kidId) || t("famOpt")}: ${e.title} — ${fmtTime(e.start)}`).join("\n") };
  }

  // Conflicts
  if (/conflict|clash|overlap/.test(lower)) {
    const issues = [];
    for (const e of state.events) {
      for (const msg of checkConflicts(e, e.id)) issues.push(`• ${e.title} (${displayDate(e.date)}): ${msg}`);
    }
    if (!issues.length) return { text: "I checked the whole schedule — no overlaps, travel-buffer clashes, or daily-limit issues. You're all clear! ✅" };
    return { text: "I found a few things to look at:\n" + [...new Set(issues)].slice(0,4).join("\n") };
  }

  // Move / reschedule
  const mv = lower.match(/(?:move|change|reschedule|swap)\s+(.*?)(?:\s+to\s+)(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/);
  if (mv) {
    const target = state.events.find(e =>
      lower.includes(e.title.toLowerCase().split(" ")[0].toLowerCase()) ||
      (kidName(e.kidId) && lower.includes(kidName(e.kidId).toLowerCase())));
    if (target) {
      let h = +mv[2]; const ap = mv[4] || (h < 8 ? "pm" : "am");
      if (ap === "pm" && h < 12) h += 12;
      const newStart = h*60 + (+(mv[3]||0));
      return {
        text: `Sure! I can move ${kidName(target.kidId) ? kidName(target.kidId)+"'s" : ""} ${target.title} from ${fmtTime(target.start)} to ${fmtTime(newStart)} on ${displayDate(target.date)}. Confirm below.`,
        action: { eventId: target.id, newStart, desc: `Change time of ${target.title} from ${fmtTime(target.start)} to ${fmtTime(newStart)}` }
      };
    }
    return { text: "I couldn't find that activity. Try the exact name or the kid's name — e.g. \"Move Lexi's swim to 4pm\"." };
  }

  // Cancel
  if (/cancel|delete|remove/.test(lower)) {
    const target = state.events.find(e => lower.includes(e.title.toLowerCase().split(" ")[0]) ||
      (kidName(e.kidId) && lower.includes(kidName(e.kidId).toLowerCase())));
    if (target) return {
      text: `Okay — cancel ${target.title} on ${displayDate(target.date)} at ${fmtTime(target.start)}? Confirm below.`,
      action: { eventId: target.id, cancel: true, desc: `Cancel ${target.title} (${displayDate(target.date)})` }
    };
    return { text: "Which activity should I cancel? Tell me the name or the kid it belongs to." };
  }

  // Add (route through NL parser)
  if (/add|book|schedule|new/.test(lower)) {
    const p = parseNL(text);
    p.id = state.nextPendingId++;
    state.pending.push(p);
    return { text: `I've drafted "${p.title}" for ${kidName(p.kidId) || "the family"} on ${displayDate(p.date)} at ${fmtTime(p.start)} — it's waiting in your Approvals tab. ✅` };
  }

  return { text: "I can help you check today's schedule, move or cancel activities, scan for conflicts, or add something new — for example: \"Add Leo tennis Friday 4pm\". (In the real app I'm powered by Google Gemini.)" };
}
function applyChatAction() {
  const a = state.pendingAction;
  if (a) {
    if (a.add) {
      state.events.push({ id: state.nextEventId++, title: a.add.title, kidId: a.add.kidId,
        date: a.add.date, start: a.add.start, end: a.add.end, buffer: a.add.buffer,
        recurring: a.add.recurring, notes: `Added via assistant: '${a.add.raw}'` });
      state.chat.push({ from: "ai", text: `✅ Added ${a.add.title} on ${displayDate(a.add.date)} at ${fmtTime(a.add.start)}.`, time: nowStamp() });
    } else {
      const ev = state.events.find(e => e.id === a.eventId);
      if (ev && a.note) {
        ev.notes = ev.notes ? ev.notes + " · " + a.note : a.note;
        state.chat.push({ from: "ai", text: lang() === "zh" ? `✅ 已幫「${ev.title}」加備註。` : `✅ Note added to ${ev.title}.`, time: nowStamp() });
      } else if (ev && a.cancel) {
        state.events = state.events.filter(e => e.id !== a.eventId);
        state.chat.push({ from: "ai", text: `✅ Cancelled ${ev.title}.`, time: nowStamp() });
      } else if (ev) {
        const dur = ev.end - ev.start;
        ev.start = a.newStart; ev.end = a.newStart + dur;
        if (a.newDate) ev.date = a.newDate;
        state.chat.push({ from: "ai", text: `✅ Done! ${ev.title} is now at ${fmtTime(ev.start)}${a.newDate ? " on " + displayDate(a.newDate) : ""}.`, time: nowStamp() });
      }
    }
  }
  state.pendingAction = null; render();
}
function dismissChatAction() {
  state.chat.push({ from: "ai", text: "No problem! I cancelled that change.", time: nowStamp() });
  state.pendingAction = null; render();
}

  if (kid && kid.photo) {
    return `<img src="${kid.photo}" class="avatar" style="width:${s}px;height:${s}px;object-fit:cover" alt="${esc(kid.name)}">`;
  }

function pickKidPhoto(id) {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "image/*";
  input.onchange = () => {
    const file = input.files && input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement("canvas");
        const side = Math.min(img.width, img.height);
        canvas.width = 96; canvas.height = 96;
        canvas.getContext("2d").drawImage(
          img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, 96, 96
        );
        const kid = state.kids.find(k => k.id === id);
        if (kid) { kid.photo = canvas.toDataURL("image/jpeg", 0.82); save(); render(); }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

  const remindVal = editing ? (editing.remind || 0) : 0;

  // Multi-select participants (Agnes: e.g. Tina + Agnes both go)
  const kidChips = [`<span class="chip small addev-kid ${selKids.length === 0 ? "selected" : ""}" data-kid="">${t("famOpt")}</span>`]
    .concat(state.kids.map(k =>
      `<span class="chip small addev-kid ${selKids.includes(k.id) ? "selected" : ""}" data-kid="${k.id}">${esc(k.name)}</span>`)).join(" ");

  // Always include this event's own duration so one chip is guaranteed selected
  const durLabel = d => d < 60 ? `${d}m` : (d % 60 ? `${Math.floor(d / 60)}h${pad(d % 60)}` : `${d / 60}h`);
  const durOpts = [...new Set([30, 45, 60, 90, 120, durVal])].sort((a, b) => a - b);
  const durChip = d => `<span class="chip small addev-dur ${durVal === d ? "selected" : ""}" data-d="${d}">${durLabel(d)}</span>`;
  const bufChip = b => `<span class="chip small addev-buf ${bufVal === b ? "selected" : ""}" data-b="${b}">${b === 0 ? t("none") : b + "m"}</span>`;
  const remChip = r => `<span class="chip small addev-rem ${remindVal === r ? "selected" : ""}" data-r="${r}">${r === 0 ? t("none") : (r === -1 ? t("atStart") : r + "m")}</span>`;

  document.getElementById("dialog-root").innerHTML = `
    <div class="overlay" onclick="if(event.target===this)closeDialog()">
      <div class="dialog">
        <h2>${_aeEditId ? t("editAct") : t("newAct")}</h2>
        <label>${t("actTitle")}</label>
        <input type="text" id="ae-title" placeholder="${t("actTitlePh")}" value="${editing ? esc(editing.title) : ""}">
        <label>${t("whoFor")}</label>
        <div class="chip-row" id="ae-kids">${kidChips}</div>
        <label>${t("dateL")}</label>
        <div class="month-head">
          <button class="icon-btn" onclick="aeShiftDate(-1)">‹</button>
          <span class="mh-title" id="ae-date-label" style="font-size:14px"></span>
          <button class="icon-btn" onclick="aeShiftDate(1)">›</button>
        </div>
        <input type="date" id="ae-date" class="field-input" title="${t("pickDate2")}"
               onchange="if(this.value){window._aeDate=this.value;aeDateLabel();aeConflicts()}">
        <label>${t("startsAt")} <span id="ae-hour-label"></span></label>
        <input type="range" id="ae-hour" min="360" max="1290" step="5" value="${startVal}" oninput="aeHourLabel();aeConflicts()">
        <input type="time" id="ae-time" class="field-input" title="${t("typeTime")}" style="margin-top:6px"
               onchange="aeTimeTyped(this.value)">
        <label>${t("durationL")}</label>
        <div class="chip-row" id="ae-dur">${durOpts.map(durChip).join("")}</div>
        <label>${t("bufferL")}</label>
        <div class="chip-row" id="ae-buf">${[0,10,15,30].map(bufChip).join("")}</div>
        <label>${t("locationL")}</label>
        <input type="text" id="ae-loc" placeholder="${t("locPh")}" value="${editing && editing.location ? esc(editing.location) : ""}">
        <label>${t("notesL")}</label>
        <input type="text" id="ae-notes" placeholder="${t("notesPh")}" value="${editing && editing.notes ? esc(editing.notes) : ""}">
        <label>${t("remindL")}</label>
        <div class="chip-row" id="ae-rem">${[0,-1,15,30,60].map(remChip).join("")}</div>
        <div id="ae-conflicts"></div>
        <div class="dialog-actions">
          <button class="btn btn-outlined" onclick="closeDialog()">${t("cancelBtn")}</button>
          <button class="btn btn-filled" onclick="confirmAddEvent()">${_aeEditId ? t("saveBtn") : t("addBtn")}</button>
        </div>
      </div>
    </div>`;
  window._aeDate = editing ? editing.date : (presetDate || activeDate);
  aeDateLabel(); aeHourLabel();
  // Preserve exact start time even if outside the slider's range
  window._aeStart = startVal;
  document.getElementById("ae-hour-label").textContent = fmtTime(startVal);
  const tiInit = document.getElementById("ae-time");
  if (tiInit) tiInit.value = `${pad(Math.floor(startVal / 60))}:${pad(startVal % 60)}`;
  // Participants: multi-select; "Family" clears individual picks
  document.querySelectorAll(".addev-kid").forEach(el => el.onclick = () => {
    if (!el.dataset.kid) {
      document.querySelectorAll(".addev-kid").forEach(x => x.classList.remove("selected"));
      el.classList.add("selected");
    } else {
      el.classList.toggle("selected");
      const famChip = document.querySelector('.addev-kid[data-kid=""]');
      const anySel = [...document.querySelectorAll(".addev-kid")].some(x => x.dataset.kid && x.classList.contains("selected"));
      famChip.classList.toggle("selected", !anySel);
    }
    aeConflicts();
  });
  document.querySelectorAll(".addev-dur").forEach(el => el.onclick = () => { selectChip(el, "addev-dur"); aeConflicts(); });
  document.querySelectorAll(".addev-buf").forEach(el => el.onclick = () => { selectChip(el, "addev-buf"); aeConflicts(); });
  document.querySelectorAll(".addev-rem").forEach(el => el.onclick = () => selectChip(el, "addev-rem"));
  aeConflicts();
}
function selectChip(el, cls) {
  document.querySelectorAll("." + cls).forEach(x => x.classList.remove("selected"));
  el.classList.add("selected");
}
function aeShiftDate(n) { window._aeDate = addDays(window._aeDate, n); aeDateLabel(); aeConflicts(); }
function aeDateLabel() {
  const el = document.getElementById("ae-date-label");
  if (el) el.textContent = displayDateL(window._aeDate);
  const di = document.getElementById("ae-date");
  if (di) di.value = window._aeDate;
}
function aeHourLabel() {
  const mins = +document.getElementById("ae-hour").value;
  window._aeStart = mins;
  document.getElementById("ae-hour-label").textContent = fmtTime(mins);
  const ti = document.getElementById("ae-time");
  if (ti) ti.value = `${pad(Math.floor(mins / 60))}:${pad(mins % 60)}`;
}
// Typed time (Agnes: let me enter the exact time — any time, not just slider range)
function aeTimeTyped(v) {
  const m = String(v).match(/(\d{1,2}):(\d{2})/);
  if (!m) return;
  const mins = (+m[1]) * 60 + (+m[2]);
  window._aeStart = mins;
  const slider = document.getElementById("ae-hour");
  slider.value = Math.min(Math.max(mins, +slider.min), +slider.max);
  document.getElementById("ae-hour-label").textContent = fmtTime(mins);
  aeConflicts();
}
function aeReadForm() {
  const pids = [...document.querySelectorAll(".addev-kid.selected")]
    .map(el => el.dataset.kid).filter(Boolean).map(Number);
  return {
    title: document.getElementById("ae-title").value.trim(),
    participants: pids,
    kidId: pids[0] != null ? pids[0] : null,
    date: window._aeDate,
    start: window._aeStart != null ? window._aeStart : +document.getElementById("ae-hour").value,
    dur: (() => { const el = document.querySelector(".addev-dur.selected"); return el ? +el.dataset.d : 60; })(),
    buffer: (() => { const el = document.querySelector(".addev-buf.selected"); return el ? +el.dataset.b : 0; })(),
    location: document.getElementById("ae-loc").value.trim(),
    notes: document.getElementById("ae-notes").value.trim(),
    remind: (() => { const el = document.querySelector(".addev-rem.selected"); return el ? +el.dataset.r : 0; })()
  };
}
// Live conflict preview inside the dialog (Ocean: warn BEFORE adding)
function aeConflicts() {
  const box = document.getElementById("ae-conflicts");
  if (!box) return;
  const f = aeReadForm();
  const kidsToCheck = f.participants.length ? f.participants : [null];
  const all = new Set();
  for (const kid of kidsToCheck) {
    checkConflicts(
      { date: f.date, start: f.start, end: f.start + f.dur, buffer: f.buffer, kidId: kid },
      _aeEditId
    ).forEach(c => all.add(c));
  }
  const conflicts = [...all];
  box.innerHTML = conflicts.length
    ? `<div class="dlg-conflicts bad">⚠️ ${t("conflictsHead")}<br>${conflicts.map(esc).join("<br>")}</div>`
    : `<div class="dlg-conflicts ok">${t("noConflict")}</div>`;
}
function confirmAddEvent() {
  const f = aeReadForm();
  if (!f.title) { toast(lang() === "zh" ? "俾個活動名先" : "Give the activity a title"); return; }
  if (_aeEditId) {
    const ev = state.events.find(e => e.id === _aeEditId);
    if (ev) {
      Object.assign(ev, {
        title: f.title, kidId: f.kidId, participants: f.participants, date: f.date,
        start: f.start, end: f.start + f.dur, buffer: f.buffer,
        location: f.location || null, notes: f.notes || "", remind: f.remind
      });
    }
    closeDialog();
    toast(lang() === "zh" ? `已更新「${f.title}」✓` : `"${f.title}" updated ✓`);
  } else {
    const ev = { id: state.nextEventId++, title: f.title, kidId: f.kidId, participants: f.participants,
      date: f.date, start: f.start, end: f.start + f.dur, buffer: f.buffer, recurring: false,
      notes: f.notes || "", location: f.location || null, remind: f.remind };
    state.events.push(ev);
    activeDate = ev.date;
    closeDialog();
    toast(lang() === "zh" ? `已加入「${f.title}」✓` : `"${f.title}" added ✓`);
  }
  _aeEditId = null;
  render();
}

let _akEditId = null;
function openAddKid(editId) {
  _akEditId = editId || null;
  const editing = _akEditId ? state.kids.find(k => k.id === _akEditId) : null;
  const colors = ["#E64A19","#1976D2","#388E3C","#7B1FA2","#F9A825","#C2185B","#00796B","#455A64"];
  const selColor = editing ? editing.color : colors[0];
  const selRole = editing ? (editing.role || "kid") : "kid";
  const noLim = editing && editing.limit >= 999;
  const limVal = editing && !noLim ? editing.limit : 2;
  document.getElementById("dialog-root").innerHTML = `
    <div class="overlay" onclick="if(event.target===this)closeDialog()">
      <div class="dialog">
        <h2>${_akEditId ? t("editMember") : t("addKidTitle")}</h2>
        <label>${t("nameL")}</label>
        <input type="text" id="ak-name" placeholder="${t("namePh")}" value="${editing ? esc(editing.name) : ""}">
        <label>${t("roleL")}</label>
        <div class="chip-row" id="ak-role">
          <span class="chip small ak-role ${selRole === "kid" ? "selected" : ""}" data-role="kid">${t("roleKid")}</span>
          <span class="chip small ak-role ${selRole === "parent" ? "selected" : ""}" data-role="parent">${t("roleParent")}</span>
          <span class="chip small ak-role ${selRole === "helper" ? "selected" : ""}" data-role="helper">${t("roleHelper")}</span>
        </div>
        <div class="sub" style="font-size:11px;color:var(--faint);margin-top:6px" id="ak-role-note"></div>
        <label>${t("colorL")}</label>
        <div class="swatches" id="ak-colors">
          ${colors.map(c => `<div class="swatch ${c === selColor ? "selected" : ""}" style="background:${c}" data-c="${c}"></div>`).join("")}
        </div>
        <label>${t("dailyLimitL")}: <span id="ak-lim-label">${noLim ? "∞" : limVal}</span></label>
        <input type="range" id="ak-lim" min="1" max="10" value="${limVal}" step="1"
               oninput="document.getElementById('ak-lim-label').textContent=this.value;document.getElementById('ak-nolimit').classList.remove('selected')">
        <div class="chip-row" style="margin-top:8px">
          <span class="chip small ${noLim ? "selected" : ""}" id="ak-nolimit"
                onclick="this.classList.toggle('selected');document.getElementById('ak-lim-label').textContent=this.classList.contains('selected')?'∞':document.getElementById('ak-lim').value">∞ ${t("noLimit")}</span>
        </div>
        <div class="dialog-actions">
          <button class="btn btn-outlined" onclick="closeDialog()">${t("cancelBtn")}</button>
          <button class="btn btn-filled" onclick="confirmAddKid()">${_akEditId ? t("saveBtn") : t("addBtn")}</button>
        </div>
      </div>
    </div>`;
  document.querySelectorAll(".swatch").forEach(el => el.onclick = () => {
    document.querySelectorAll(".swatch").forEach(x => x.classList.remove("selected"));
    el.classList.add("selected");
  });
  document.querySelectorAll(".ak-role").forEach(el => el.onclick = () => {
    selectChip(el, "ak-role");
    document.getElementById("ak-role-note").textContent = el.dataset.role === "helper" ? t("helperNote") : "";
  });
}
function confirmAddKid() {
  const name = document.getElementById("ak-name").value.trim();
  if (!name) { toast(lang() === "zh" ? "入返個名先" : "Enter a name"); return; }
  const color = document.querySelector(".swatch.selected").dataset.c;
  const role = document.querySelector(".ak-role.selected").dataset.role;
  const noLimit = document.getElementById("ak-nolimit").classList.contains("selected");
  const limit = noLimit ? 999 : +document.getElementById("ak-lim").value;
  if (_akEditId) {
    const k = state.kids.find(x => x.id === _akEditId);
    if (k) Object.assign(k, { name, color, role, limit });
    closeDialog();
    toast(lang() === "zh" ? `已更新 ${name} ✓` : `${name} updated ✓`);
  } else {
    state.kids.push({ id: state.nextKidId++, name, color, limit, role });
    closeDialog();
    toast(lang() === "zh" ? `${name} 已加入家庭 🎉` : `${name} added to the family 🎉`);
  }
  _akEditId = null;
  render();
}

// ---------- Snackbar (with optional action button) ----------
let toastTimer = null;
let toastAction = null;
function toast(msg, actionLabel, actionFn) {
  const el = document.getElementById("snackbar");
  toastAction = actionFn || null;
  el.innerHTML = `<span style="flex:1">${esc(msg)}</span>` +
    (actionLabel ? `<button class="snack-btn" onclick="runToastAction()">${esc(actionLabel)}</button>` : "");
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), actionLabel ? 5000 : 3200);
}
function runToastAction() {
  if (toastAction) toastAction();
  toastAction = null;
  document.getElementById("snackbar").classList.remove("show");
}

// ---------- Generic confirm dialog ----------
let _confirmFn = null;
function openConfirm(text, yesLabel, onYes) {
  _confirmFn = onYes;
  document.getElementById("dialog-root").innerHTML = `
    <div class="overlay" onclick="if(event.target===this)closeDialog()">
      <div class="dialog">
        <p style="font-size:14.5px;font-weight:600;line-height:1.55">${esc(text)}</p>
        <div class="dialog-actions">
          <button class="btn btn-outlined" onclick="closeDialog()">${t("cancelBtn")}</button>
          <button class="btn btn-filled" onclick="closeDialog();if(window._cf){const f=window._cf;window._cf=null;f()}" id="confirm-yes">${esc(yesLabel)}</button>
        </div>
      </div>
    </div>`;
  window._cf = onYes;
}

// ---------- Trash / restore ----------
function restoreEvent(trashId) {
  const idx = state.trash.findIndex(x => x.trashId === trashId);
  if (idx < 0) return;
  const item = state.trash.splice(idx, 1)[0];
  state.events.push(item.data);
  toast(t("restoredMsg"));
  render();
}
// Restore then open the edit dialog (Ocean: edit items in the bin)
function editFromTrash(trashId) {
  const idx = state.trash.findIndex(x => x.trashId === trashId);
  if (idx < 0) return;
  const item = state.trash.splice(idx, 1)[0];
  state.events.push(item.data);
  render();
  openAddEvent(item.data.id);
}

// ---------- First-run tutorial ----------
function openTour(step) {
  const steps = [
    { emoji: "👋", title: t("tour1T"), body: t("tour1B") },
    { emoji: "✨", title: t("tour2T"), body: t("tour2B") },
    { emoji: "🧠", title: t("tour3T"), body: t("tour3B") }
  ];
  const s = steps[step];
  const last = step === steps.length - 1;
  document.getElementById("dialog-root").innerHTML = `
    <div class="overlay">
      <div class="dialog" style="text-align:center"
           ontouchstart="window._tourX=event.touches[0].clientX"
           ontouchend="tourSwipe(event, ${step})">
        <div class="tour-emoji">${s.emoji}</div>
        <h2 style="text-align:center">${esc(s.title)}</h2>
        <p style="font-size:13.5px;color:var(--muted);font-weight:500;line-height:1.6">${esc(s.body)}</p>
        <div class="tour-dots">${steps.map((_, i) => `<span class="${i === step ? "on" : ""}"></span>`).join("")}</div>
        <div class="dialog-actions" style="justify-content:space-between">
          <button class="btn btn-outlined" onclick="endTour()">${t("tourSkip")}</button>
          <button class="btn btn-filled" onclick="${last ? "endTour()" : `openTour(${step + 1})`}">${last ? t("tourDone") : t("tourNext")}</button>
        </div>
      </div>
    </div>`;
}
// Swipe left/right through tour steps (Ocean)
function tourSwipe(ev, step) {
  if (window._tourX == null) return;
  const dx = ev.changedTouches[0].clientX - window._tourX;
  window._tourX = null;
  if (dx < -40) { if (step < 2) openTour(step + 1); else endTour(); }
  else if (dx > 40 && step > 0) openTour(step - 1);
}
function endTour() {
  state.settings.seenTour = true;
  save();
  closeDialog();
}

render();
if (!state.settings.seenTour) setTimeout(() => openTour(0), 600);
</script>
</body>
